function sw(x0){const n=x0.length;if(n<4||n>2000)return null;const x=[...x0].sort((a,b)=>a-b);

 else{phi=(ssm-2*m[n-1]**2)/(1-2*a[n-1]**2);for(let i=1;i<n-1;i++)a[i]=m[i]/Math.sqrt(phi);a[0]=-a[n-1]}

function anova(arrs){const k=arrs.length,N=arrs.reduce((s,a)=>s+a.length,0),gm=mean(arrs.flat());

function powF(lam,d1,d2,al){const c=jStat.centralF.inv(1-al,d1,d2),x=d1*c/(d1*c+d2),m=lam/2;let s=0;for(let j=0;j<m+12*Math.sqrt(m)+60;j++){const w=Math.exp(-m+j*Math.log(m||1e-300)-jStat.gammaln(j+1));s+=w*jStat.ibeta(x,d1/2+j,d2/2)}return Math.min(1,Math.max(0,1-s))}
function runPlan(){const al=cur.alpha,p=cur.pl,o=$('out'),a=Math.max(2,p.a|0),b=Math.max(1,p.b|0),d1=a-1,rows=[];

 <table><tr><th>n per cell</th><th>Total runs</th><th>Error df</th><th>λ</th><th>Critical F</th><th>Power</th></tr>${rows.map(r=>`<tr><td>${r.n}</td><td>${r.N}</td><td>${r.d2}</td><td>${f4(r.lam)}</td><td>${r.crit===null?'—':f4(r.crit)}</td><td>${r.pw===null?'n/a (no error df)':r.pw.toFixed(6)}</td></tr>`).join('')}</table><div id="p4"></div>`)
