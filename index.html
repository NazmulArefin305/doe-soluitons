<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOE Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--ink:#17212b;--mut:#5b6773;--line:#d5dbe0;--bg:#f6f8f9;--teal:#147d92;--amb:#d97706;--red:#b42318;--ok:#157347}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100vh}
aside{width:310px;background:#10222b;color:#dbe7ec;padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside h1{font-size:17px;margin:0 0 14px;color:#fff}aside label{font-size:12px;color:#8fb0bd}
select,textarea,button{font:inherit}aside select{width:100%;padding:7px;margin:4px 0 14px;border-radius:6px;border:0}
main{flex:1;min-width:0;width:100%;max-width:1100px;margin:0 auto;padding:clamp(14px,3vw,34px)}
.card{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:18px}
.card h2{margin:0 0 10px;font-size:17px}.card h2 span{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--teal);color:#fff;font-size:13px;margin-right:8px}
.m{font-family:'IBM Plex Mono',monospace}.note{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;color:#fff;background:var(--mut)}.ok{background:var(--ok)}.bad{background:var(--red)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
textarea{width:100%;height:110px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.dec{font-size:16px;padding:12px 14px;border-left:4px solid var(--red);background:#fdf1ef}.dec.n{border-color:var(--ok);background:#eef8f2}
@media(max-width:900px){body{display:block}aside{width:auto;height:auto;position:static;padding:14px}aside select{margin-bottom:8px}.g,.g3{grid-template-columns:1fr}}
@media(max-width:480px){body{font-size:14px}.card{padding:14px}input[type=range]{width:100%!important}}
</style></head><body>
<aside><h1>Design &amp; Analysis of Experiments<br><span style="font-weight:400;font-size:13px">Textbook solutions</span></h1>
<label>Chapter</label><select id="ch"></select><label>Problem</label><select id="pb"></select></aside>
<main id="main"></main>
<script>
const $=id=>document.getElementById(id),qn=p=>jStat.normal.inv(p,0,1),mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const vr=a=>{const m=mean(a);return a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1)};
const f4=x=>Math.abs(x)<1e-4&&x!==0?x.toExponential(2):x.toFixed(4),fp=p=>p<1e-4?'< 0.0001':p.toFixed(4);
const med=a=>{const s=[...a].sort((x,y)=>x-y),h=s.length>>1;return s.length%2?s[h]:(s[h-1]+s[h])/2};
/* ---------- data ---------- */
const PEMF=[4.51,7.95,4.97,3.00,7.97,2.23,3.95,5.64,9.35,6.52,4.96,6.10,7.19,4.03,2.72,9.19,5.17,5.70,5.85,6.45,5.32,6.00,5.12,7.08,5.48,6.52,4.09,6.28,7.77,5.68,8.47,4.58,4.11,5.72,5.91,6.89,6.99,4.98,9.94,6.38,4.73,5.81,5.69,3.86,4.06,6.56,8.34,3.01,6.71,6.51,1.70,5.89,6.55,5.34,5.88,7.50,3.28,5.38,7.30,5.46,7.03,4.65,6.65,5.49,6.98,4.85,7.26,5.92,5.58,7.91,4.90,4.54,8.18,5.42,6.03,7.04,5.17,7.60,7.90,7.91];
const CEMENT={'Technique 1':[3129,3000,2865,2890],'Technique 2':[3200,3300,2975,3150],'Technique 3':[2800,2900,2985,3050],'Technique 4':[2600,2700,2600,2765]};
const COTTON={'Cotton 15%':[7,7,15,11,9],'Cotton 20%':[12,17,12,18,18],'Cotton 25%':[14,19,19,18,18],'Cotton 30%':[19,25,22,19,23],'Cotton 35%':[7,10,11,15,11]};
const PEMFG={'Sham':PEMF.slice(0,20),'PEMF 1 h':PEMF.slice(20,40),'PEMF 2 h':PEMF.slice(40,60),'PEMF 4 h':PEMF.slice(60)};
const DEMO={'Group A':[10.1,10.4,9.8,10.7,9.9,10.2,10.5,9.7],'Group B':[11.0,10.6,11.2,10.8,11.4,10.9,10.7,11.1],'Group C':[12.0,11.6,12.2,11.8,12.4,11.9,11.7,12.1]};
const DATA={'3.10':PEMFG,'3.11':CEMENT,'3.12':CEMENT,'3.13':CEMENT,'3.14':COTTON,'3.15':COTTON};
const TITLE={7:'Complete an ANOVA table',8:'Complete an ANOVA table',9:'Chocolate and depression (study design)',10:'PEMF and bone-density loss',11:'Cement mixing techniques',12:'Tukey comparisons for cement',13:'Cement confidence intervals',14:'Cotton content and fiber strength',15:'Cotton comparisons vs control',34:'Raw-material batches',35:'Oven temperatures',36:'Wafer-position uniformity',37:'Variance due to wafer positions',42:'Compare bleaching chemicals',44:'Pooled t test and one-way ANOVA',45:'Variance of a linear combination',56:'Feed rate and dimension variability',57:'Least-squares normal equations',62:'Loom output: random effects',63:'ANOVA assumptions'};
const HINT={'3.10':'Compare sham and PEMF treatment groups, then examine residuals and pairwise differences.','3.11':'Test equality of four mixing-technique means; follow a significant omnibus test with pairwise comparisons.','3.14':'Test the effect of cotton percentage on mean fiber strength; follow with pairwise comparisons.','3.44':'For two normal populations with equal unknown variances, the pooled t test and one-way ANOVA are equivalent.'};
const ids=[...Array(40).keys()].map(i=>i+7).concat([48,49,50,51,52,53,55,56,57,58,59,60,61,62,63]);
const CH={3:{name:'Chapter 3 · Single-factor experiments',probs:ids.map(n=>['3.'+n,TITLE[n]||'Exercise 3.'+n])}};
/* ---------- statistics ---------- */
function sw(x0){const n=x0.length;if(n<4||n>2000)return null;const x=[...x0].sort((a,b)=>a-b);
 const m=x.map((_,i)=>qn((i+1-.375)/(n+.25))),ssm=m.reduce((s,v)=>s+v*v,0),u=1/Math.sqrt(n),sq=Math.sqrt(ssm);
 const P=c=>c[0]*u**5+c[1]*u**4+c[2]*u**3+c[3]*u**2+c[4]*u,a=new Array(n).fill(0);
 a[n-1]=P([-2.706056,4.434685,-2.07119,-.147981,.221157])+m[n-1]/sq;let phi;
 if(n>5){a[n-2]=P([-3.582633,5.682633,-1.752461,-.293762,.042981])+m[n-2]/sq;
  phi=(ssm-2*m[n-1]**2-2*m[n-2]**2)/(1-2*a[n-1]**2-2*a[n-2]**2);for(let i=2;i<n-2;i++)a[i]=m[i]/Math.sqrt(phi);a[0]=-a[n-1];a[1]=-a[n-2]}
 else{phi=(ssm-2*m[n-1]**2)/(1-2*a[n-1]**2);for(let i=1;i<n-1;i++)a[i]=m[i]/Math.sqrt(phi);a[0]=-a[n-1]}
 const mu=mean(x);let nu=0,de=0;x.forEach((v,i)=>{nu+=a[i]*v;de+=(v-mu)**2});if(de===0)return null;
 const W=Math.min(nu*nu/de,.99999999),L=Math.log(n);let z;
 if(n>=12){const y=Math.log(1-W);z=(y-(.0038915*L**3-.083751*L**2-.31082*L-1.5861))/Math.exp(.0030302*L**2-.082676*L-.4803)}
 else{const y=-Math.log(-2.273+.459*n-Math.log(1-W));z=(y-(.544-.39978*n+.025054*n**2-.0006714*n**3))/Math.exp(1.3822-.77857*n+.062767*n**2-.0020322*n**3)}
 return{W,p:1-jStat.normal.cdf(z,0,1)}}
function anova(arrs){const k=arrs.length,N=arrs.reduce((s,a)=>s+a.length,0),gm=mean(arrs.flat());
 const ssb=arrs.reduce((s,a)=>s+a.length*(mean(a)-gm)**2,0),ssw=arrs.reduce((s,a)=>s+(a.length-1)*vr(a),0);
 const d1=k-1,d2=N-k,F=(ssb/d1)/(ssw/d2);return{ssb,ssw,d1,d2,msb:ssb/d1,mse:ssw/d2,F,p:1-jStat.centralF.cdf(F,d1,d2)}}
const levene=arrs=>anova(arrs.map(a=>{const m=med(a);return a.map(v=>Math.abs(v-m))}));
/* ---------- plots ---------- */
const lay=(t,x,y)=>({title:{text:t,font:{size:13}},xaxis:{title:x},yaxis:{title:y},margin:{l:50,r:10,t:34,b:42},height:260,paper_bgcolor:'rgba(0,0,0,0)',font:{family:'IBM Plex Sans'},showlegend:false});
const draw=(id,tr,l)=>Plotly.newPlot(id,tr,l,{displayModeBar:false,responsive:true});
function regionPlot(id,type,stat,crit,d1,d2){const xs=[],ys=[];let lo,hi;
 if(type==='F'){lo=.02;hi=Math.max(crit*2,stat*1.2,6)}else{const w=Math.max(4,Math.abs(stat)*1.2,Math.abs(crit)*1.3);lo=-w;hi=w}
 for(let i=0;i<=300;i++){const x=lo+(hi-lo)*i/300;xs.push(x);ys.push(type==='F'?jStat.centralF.pdf(x,d1,d2):jStat.studentt.pdf(x,d1))}
 const tr=[{x:xs,y:ys,mode:'lines',line:{color:'#147d92',width:2}}];
 const tail=f=>{const px=xs.filter(f);return{x:px,y:px.map(x=>type==='F'?jStat.centralF.pdf(x,d1,d2):jStat.studentt.pdf(x,d1)),fill:'tozeroy',mode:'none',fillcolor:'rgba(217,119,6,.4)'}};
 tr.push(tail(x=>type==='F'?x>=crit:Math.abs(x)>=Math.abs(crit)&&(x<0)===(x<0)));
 const top=Math.max(...ys.filter(isFinite))*1.05;
 tr.push({x:[stat,stat],y:[0,top],mode:'lines',line:{color:'#b42318',width:2}});
 const l=lay(type==='F'?'F distribution — rejection region (shaded)':'t distribution — rejection regions (shaded)','test statistic','density');l.height=300;draw(id,tr,l)}
/* ---------- app ---------- */
let cur={id:'',groups:{},real:false};
function init(){const s=$('ch');for(const c in CH)s.add(new Option(CH[c].name,c));s.onchange=list;list()}
function list(){const c=CH[$('ch').value],s=$('pb');s.innerHTML=c.probs.map(p=>`<option value="${p[0]}">${p[0]} — ${p[1]}</option>`).join('');s.onchange=()=>pick(s.value,c);pick(c.probs.find(p=>DATA[p[0]])[0],c)}
function pick(id,c){$('pb').value=id;
 cur={id,title:c.probs.find(p=>p[0]===id)[1],groups:JSON.parse(JSON.stringify(DATA[id]||DEMO)),real:!!DATA[id]};cur.alpha=.05;shell();run()}
function parseCSV(t){const g={};t.trim().split(/\n/).slice(1).forEach(r=>{const[a,b]=r.split(',');const v=parseFloat(b);if(a&&isFinite(v))(g[a.trim()]=g[a.trim()]||[]).push(v)});return g}
function shell(){const csv='group,value\n'+Object.entries(cur.groups).flatMap(([k,a])=>a.map(v=>k+','+v)).join('\n');
 $('main').innerHTML=`<div class="card"><h2 style="font-size:20px">Problem ${cur.id} — ${cur.title}</h2>
 <p>${HINT[cur.id]||'Select a test on the data below. Enter the values from the textbook exercise in the data box.'}</p>
 <span class="tag ${cur.real?'ok':''}">${cur.real?'Textbook data':'Demo data — replace with the exercise values'}</span>
 <details style="margin-top:10px"><summary>Data (editable CSV: group,value)</summary><textarea id="csv">${csv}</textarea><br><button id="ap">Apply data</button></details></div>
 <div id="out"></div>`;
 $('ap').onclick=()=>{cur.groups=parseCSV($('csv').value);cur.real=true;run()}}
function run(){const g=cur.groups,names=Object.keys(g),k=names.length,arrs=names.map(n=>g[n]),al=cur.alpha,N=arrs.flat().length;
 const o=$('out');if(k<2||arrs.some(a=>a.length<2)){o.innerHTML='<div class="card">At least two groups with two or more observations each are needed.</div>';return}
 const res=[];arrs.forEach((a,i)=>a.forEach(v=>res.push(v-mean(a))));
 const S=sw(res),L=k>2?levene(arrs):levene(arrs);const normOK=S?S.p>=al:true,varOK=L.p>=al,anv=anova(arrs);
 const H0=k>2?'μ₁ = μ₂ = … = μ'+k:'μ₁ = μ₂',H1=k>2?'at least one mean differs':'μ₁ ≠ μ₂';
 let h=`<div class="card"><h2><span>1</span>Hypotheses</h2><p class="m">H₀: ${H0}<br>H₁: ${H1}</p><p class="note">${k} groups, N = ${N} observations.</p></div>
 <div class="card"><h2><span>2</span>Sensitivity (significance level α)</h2><input type="range" id="al" min="0.01" max="0.10" step="0.01" value="${al}" style="width:260px"> <b class="m" id="alv">α = ${al.toFixed(2)}</b>
 <p class="note">Changing α recomputes every step below.</p></div>
 <div class="card"><h2><span>3</span>Normality and assumption checks</h2>
 <table><tr><th>Group</th><th>n</th><th>Mean</th><th>SD</th></tr>${names.map((n,i)=>`<tr><td>${n}</td><td>${arrs[i].length}</td><td>${f4(mean(arrs[i]))}</td><td>${f4(Math.sqrt(vr(arrs[i])))}</td></tr>`).join('')}</table>
 <div class="g" style="margin-top:10px"><div id="p1"></div><div id="p2"></div></div>
 <p><b>Normality (Shapiro–Wilk on residuals):</b> ${S?`W = ${S.W.toFixed(4)}, p = ${fp(S.p)} <span class="tag ${normOK?'ok':'bad'}">${normOK?'normality not rejected':'normality rejected'}</span>`:'needs 4 to 2000 residuals'}<br>
 <b>Equal variances (Levene, median-based):</b> F = ${L.F.toFixed(3)}, p = ${fp(L.p)} <span class="tag ${varOK?'ok':'bad'}">${varOK?'variances similar':'variances differ'}</span><br>
 <b>Independence:</b> check that residuals show no pattern against run order (plot, right).</p>
 <div id="p3"></div></div>`;
 let T,rec;
 if(k>2){rec=`One-way ANOVA (F test) — ${normOK&&varOK?'assumptions look acceptable.':'at least one assumption is doubtful; treat the result with caution'+(normOK?'':' and consider Kruskal–Wallis')+(varOK?'':' or Welch ANOVA')+'.'}`;T={type:'F',stat:anv.F,p:anv.p,d1:anv.d1,d2:anv.d2,crit:jStat.centralF.inv(1-al,anv.d1,anv.d2)}}
 else{const[a,b]=arrs,v1=vr(a)/a.length,v2=vr(b)/b.length;let t,df;
  if(varOK){const sp=((a.length-1)*vr(a)+(b.length-1)*vr(b))/(N-2);df=N-2;t=(mean(a)-mean(b))/Math.sqrt(sp*(1/a.length+1/b.length));rec='Two-sample pooled t test (equal variances, σ unknown, so t rather than z).'}
  else{t=(mean(a)-mean(b))/Math.sqrt(v1+v2);df=(v1+v2)**2/(v1**2/(a.length-1)+v2**2/(b.length-1));rec='Welch two-sample t test (variances differ, σ unknown, so t rather than z).'}
  T={type:'t',stat:t,p:2*(1-jStat.studentt.cdf(Math.abs(t),df)),d1:df,crit:jStat.studentt.inv(1-al/2,df)}}
 const rej=T.p<al;
 h+=`<div class="card"><h2><span>4</span>Recommended test and results</h2><p><b>Recommendation:</b> ${rec}</p>
 <div class="g3"><div>Statistic<br><b class="m">${T.type} = ${f4(T.stat)}</b></div><div>p-value<br><b class="m">${fp(T.p)}</b></div><div>Critical value<br><b class="m">${T.type==='t'?'±':''}${f4(T.crit)}</b></div></div>
 ${k>2?`<table style="margin-top:10px"><tr><th>Source</th><th>SS</th><th>df</th><th>MS</th><th>F</th><th>p</th></tr><tr><td>Between</td><td>${f4(anv.ssb)}</td><td>${anv.d1}</td><td>${f4(anv.msb)}</td><td>${f4(anv.F)}</td><td>${fp(anv.p)}</td></tr><tr><td>Error</td><td>${f4(anv.ssw)}</td><td>${anv.d2}</td><td>${f4(anv.mse)}</td><td></td><td></td></tr></table>`:`<p class="note">df = ${T.d1.toFixed(2)}</p>`}
 <div id="p4"></div></div>
 <div class="card"><h2><span>5</span>Decision</h2><div class="dec ${rej?'':'n'}"><b>${rej?'Reject H₀':'Fail to reject H₀'}</b> at α = ${al.toFixed(2)} (p = ${fp(T.p)} ${rej?'<':'≥'} ${al.toFixed(2)}). ${rej?(k>2?'The group means are not all equal; post hoc comparisons follow.':'The two means differ.'):'There is not enough evidence that the means differ, so no post hoc analysis is needed.'}</div></div>`;
 if(rej&&k>2){const qc=jStat.tukey.inv(1-al,k,anv.d2);let rows='';
  for(let i=0;i<k;i++)for(let j=i+1;j<k;j++){const d=mean(arrs[i])-mean(arrs[j]),se=Math.sqrt(anv.mse/2*(1/arrs[i].length+1/arrs[j].length)),q=Math.abs(d)/se,p=Math.min(1,1-jStat.tukey.cdf(q,k,anv.d2)),hw=qc*se;
   rows+=`<tr><td>${names[i]} − ${names[j]}</td><td>${f4(d)}</td><td>${f4(d-hw)}</td><td>${f4(d+hw)}</td><td>${fp(p)}</td><td>${p<al?'<b style="color:#b42318">Different</b>':'—'}</td></tr>`}
  h+=`<div class="card"><h2><span>6</span>Post hoc: Tukey HSD</h2><table><tr><th>Comparison</th><th>Diff</th><th>Lower</th><th>Upper</th><th>Adj. p</th><th>Result</th></tr>${rows}</table></div>`}
 else if(rej)h+=`<div class="card"><h2><span>6</span>Post hoc</h2><p>With two groups the t test already answers which means differ.</p></div>`;
 o.innerHTML=h;
 $('al').oninput=e=>{cur.alpha=+e.target.value;run()};
 draw('p1',[{x:res,type:'histogram',marker:{color:'#147d92'}}],lay('Residual histogram','residual','count'));
 const sr=[...res].sort((a,b)=>a-b),th=sr.map((_,i)=>qn((i+.5)/sr.length)),sd=Math.sqrt(vr(res));
 draw('p2',[{x:th,y:sr,mode:'markers',marker:{color:'#147d92'}},{x:[th[0],th[th.length-1]],y:[th[0]*sd,th[th.length-1]*sd],mode:'lines',line:{color:'#d97706'}}],lay('Normal Q–Q plot of residuals','theoretical quantile','residual'));
 const l3=lay('Residuals vs run order','observation order','residual');l3.height=220;draw('p3',[{x:res.map((_,i)=>i+1),y:res,mode:'markers',marker:{color:'#147d92'}}],l3);
 regionPlot('p4',T.type,T.stat,T.crit,T.d1,T.d2)}
init();
</script></body></html>
